# MQTT 连接配置
mqtt:
    host: localhost
    port: 1883
    schema: tcp

    auth: false
    username: ""
    password: ""

    client_id: "hub_1001"
    clean_start: true
    keep_alive: 30

    retry:
        conn_retry_max: 3
        conn_retry_base: 2

    will:
        enabled: false
        qos: 0
        retain: false

    default_qos: 0
    max_packet_size: 1048576

# HTTP / WebSocket 服务配置
http:
    port: 8080
    host: "0.0.0.0"

    # WebSocket 配置
    websocket:
        enabled: true
        path: "/ws"
        broadcast_buffer: 100 # 广播消息缓冲区大小

    # CORS 配置
    cors:
        enabled: true
        allowed_origins:
            - "*"

    # API 配置
    api:
        prefix: "/api/v1"
        timeout: 30 # 请求超时

# TDengine 时序数据库配置
database:
    enabled: true
    host: 127.0.0.1 # 改成远程服务器 IP 即远程连接
    port: 6041 # taosAdapter REST 端口
    user: root
    password: taosdata
    dbname: mqbot

    write:
        batch_size: 500 # 攒够 500 条刷一次
        flush_interval_ms: 1000 # 或最多 1 秒刷一次，先到先触发
        channel_cap: 10000 # 内存缓冲 1 万条，约等于 1 秒 1 万条的削峰能力

# 日志配置
log:
    level: info
    format: json
    output: stdout
