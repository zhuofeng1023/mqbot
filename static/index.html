<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mqbot 控制中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <link href="static/css/tokens.css" rel="stylesheet" />
  <link href="static/css/base.css" rel="stylesheet" />
  <link href="static/css/components.css" rel="stylesheet" />
  <link href="static/css/views.css" rel="stylesheet" />
</head>

<body>
  <div class="app">
    <!-- 顶栏：Logo + 标题 + WS 连接状态 -->
    <header class="header">
      <div class="header__logo">M</div>
      <span class="header__title">mqbot 控制中心</span>
      <div class="header__sep"></div>
      <div class="header__status">
        <span class="header__dot" id="wsDot"></span>
        <span id="wsLabel">未连接</span>
      </div>
    </header>

    <div class="main">
      <!-- 中间主区域：指标条 + 地图 -->
      <div class="stage">
        <div class="dashboard" id="dashboard"></div>
        <div class="map-area" id="mapArea">
          <canvas id="map"></canvas>
          <!-- 左上角悬浮工具栏与模式提示由 JS 挂载 -->
          <div class="map-coord" id="mapCoord">移动鼠标查看坐标</div>
        </div>
      </div>

      <!-- 右侧栏：列表 / 详情 / 批量操作，内容由 JS 按状态切换 -->
      <aside class="sidebar" id="sidebar"></aside>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="static/js/main.js"></script>
</body>

</html>
